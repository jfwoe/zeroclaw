name: Release Linux QQ

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.8.5
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build Linux x86_64 GNU with QQ
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ubuntu-22.04-${{ env.TARGET }}-channel-qq
          cache-targets: false

      - name: Build release binary
        run: |
          cargo build --release --locked \
            --target "$TARGET" \
            --features channel-qq

      - name: Package release assets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG#v}"
          asset="zeroclaw-${version}-linux-x86_64-gnu-qq"
          mkdir -p dist/"$asset"
          install -m 0755 "target/$TARGET/release/zeroclaw" "dist/$asset/zeroclaw"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          sha256sum "dist/$asset.tar.gz" > "dist/$asset.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256